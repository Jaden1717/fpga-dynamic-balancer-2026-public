<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-labelledby="t"><title id="t">Signal flow: capture, prepare, compute and review. Capture and compute overlays run sequentially.</title><rect width="1200" height="200" rx="10" fill="#edf4f8"/><rect x="20" y="30" width="267" height="126" rx="8" fill="#ffffff" stroke="#c8d9e4"/><rect x="20" y="30" width="267" height="5" fill="#187e88"/><text x="37" y="66" font-family="Arial,sans-serif" font-weight="bold" font-size="18" fill="#163b62">CAPTURE / PL</text><text x="37" y="101" font-family="Arial,sans-serif" font-size="15" fill="#37536a">Shared clock · SPI + TACH</text><text x="37" y="128" font-family="Arial,sans-serif" font-size="15" fill="#37536a">Timestamped samples</text><path d="M290 93h22m-6 -5l6 5 -6 5" fill="none" stroke="#187e88" stroke-width="2"/><rect x="317" y="30" width="267" height="126" rx="8" fill="#ffffff" stroke="#c8d9e4"/><rect x="317" y="30" width="267" height="5" fill="#466582"/><text x="334" y="66" font-family="Arial,sans-serif" font-weight="bold" font-size="18" fill="#163b62">PREPARE / PS</text><text x="334" y="101" font-family="Arial,sans-serif" font-size="15" fill="#37536a">Angle resampling · Low-pass</text><text x="334" y="128" font-family="Arial,sans-serif" font-size="15" fill="#37536a">128 → 64 samples / turn</text><path d="M587 93h22m-6 -5l6 5 -6 5" fill="none" stroke="#187e88" stroke-width="2"/><rect x="614" y="30" width="267" height="126" rx="8" fill="#ffffff" stroke="#c8d9e4"/><rect x="614" y="30" width="267" height="5" fill="#187e88"/><text x="631" y="66" font-family="Arial,sans-serif" font-weight="bold" font-size="18" fill="#163b62">COMPUTE / PL</text><text x="631" y="101" font-family="Arial,sans-serif" font-size="15" fill="#37536a">Fixed-point I/Q · CORDIC</text><text x="631" y="128" font-family="Arial,sans-serif" font-size="15" fill="#37536a">1× amplitude + phase</text><path d="M884 93h22m-6 -5l6 5 -6 5" fill="none" stroke="#187e88" stroke-width="2"/><rect x="911" y="30" width="267" height="126" rx="8" fill="#ffffff" stroke="#c8d9e4"/><rect x="911" y="30" width="267" height="5" fill="#466582"/><text x="928" y="66" font-family="Arial,sans-serif" font-weight="bold" font-size="18" fill="#163b62">REVIEW / PS</text><text x="928" y="101" font-family="Arial,sans-serif" font-size="15" fill="#37536a">Reference · Statistics</text><text x="928" y="128" font-family="Arial,sans-serif" font-size="15" fill="#37536a">Traceable results</text><text x="24" y="182" font-size="13" fill="#466582" font-family="Arial,sans-serif">Sequential overlays: save capture before loading compute. Raw input and integer reference remain bound to each result.</text></svg>
