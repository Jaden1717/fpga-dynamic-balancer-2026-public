name: Offline validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install fixed PC dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Release paths, links, hashes and frozen evidence
        run: python -B tools/verify_delivery.py
      - name: Export reusable Agent Skills package
        run: python -B tools/export_skill.py --out work/ci-skill-export
      - name: Software regression
        run: python -B -m pytest -q -p no:cacheprovider --basetemp work/pytest-ci tests tools/controlled_trial/test_finish_control.py
      - name: Recheck preserved FPGA windows
        run: python -B data/review/hx_fpga_replay_20261101/verify_eight_windows.py
      - name: Recompute five-state batch
        run: python -B tools/review_control_batch.py work/ci-control-review
